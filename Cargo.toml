[package]
name = "skill-anatomy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GitHub skill discovery and resumable research preparation for AI agents"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5.60", features = ["derive"] }
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.25"
url = "2.5"

[profile.release]
lto = "thin"
strip = true
